[package]
name = "fade-forge"
version = "1.0.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
rusty_mp3 = "0.8.0"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioContext",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlAudioElement",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "Url",
    "Window"
] }

[profile.release]
lto = true
opt-level = "s"
